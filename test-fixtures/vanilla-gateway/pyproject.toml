[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-vanilla-gateway-fixture"
version = "0.1.0"
description = "Deterministic client-neutral Hermes Gateway contract fixture"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.14.1,<4"]

[project.scripts]
hermes-gateway-fixture = "vanilla_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vanilla_gateway*"]

[tool.setuptools.package-data]
vanilla_gateway = ["scenarios/*.json"]
