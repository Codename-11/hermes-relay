<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-labelledby="architecture-title architecture-description" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="architecture-title">How Hermes-Relay connects</title>
  <desc id="architecture-description">The Hermes Dashboard and Gateway connect directly to Hermes-Relay Android for chat, sessions, management, and standard voice. The optional Relay plugin adds terminal, media, notifications, enhanced voice, and desktop tools. Sideload Android builds additionally enable Device Control. The API server is a compatibility fallback and chat never routes through Relay.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.56" stop-color="#0a0d18"/>
      <stop offset="1" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="coreCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10231f"/>
      <stop offset="1" stop-color="#0d171a"/>
    </linearGradient>
    <linearGradient id="relayCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1630"/>
      <stop offset="1" stop-color="#11131f"/>
    </linearGradient>
    <linearGradient id="deviceCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15182a"/>
      <stop offset="1" stop-color="#0d101a"/>
    </linearGradient>
    <marker id="coreArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#37d5b0"/>
    </marker>
    <marker id="relayArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#8b7cff"/>
    </marker>
  </defs>

  <rect width="1240" height="620" rx="24" fill="url(#canvas)"/>
  <path d="M0 506C166 472 280 554 442 522S732 462 896 512s230 25 344-3v111H0Z" fill="#17143a" opacity=".35"/>
  <path d="M0 544C170 511 301 570 463 540s269-61 427-15 239 21 350-2" fill="none" stroke="#6658d9" stroke-width="1.5" opacity=".32"/>

  <text x="54" y="58" fill="#f7f7fb" font-size="30" font-weight="750">How Hermes-Relay connects</text>
  <text x="54" y="87" fill="#9ca3b5" font-size="15">One standard path. Optional extensions when you want more.</text>

  <g aria-label="Your Hermes host">
    <text x="58" y="141" fill="#858da3" font-size="11" font-weight="700" letter-spacing="2.2">YOUR HERMES HOST</text>
    <rect x="54" y="158" width="356" height="330" rx="22" fill="#0b0e17" stroke="#242a3d" stroke-width="1.5"/>

    <rect x="78" y="186" width="308" height="128" rx="16" fill="url(#coreCard)" stroke="#2bb895" stroke-width="2"/>
    <rect x="98" y="206" width="40" height="40" rx="10" fill="#123b32" stroke="#37d5b0"/>
    <rect x="108" y="215" width="20" height="5" rx="2.5" fill="#37d5b0"/>
    <rect x="108" y="224" width="20" height="5" rx="2.5" fill="#37d5b0"/>
    <rect x="108" y="233" width="20" height="5" rx="2.5" fill="#37d5b0"/>
    <circle cx="124" cy="217.5" r="1.5" fill="#07130f"/>
    <circle cx="124" cy="226.5" r="1.5" fill="#07130f"/>
    <circle cx="124" cy="235.5" r="1.5" fill="#07130f"/>
    <text x="152" y="216" fill="#f7f7fb" font-size="17" font-weight="700">Hermes Dashboard</text>
    <text x="152" y="239" fill="#79e6ca" font-size="17" font-weight="700">+ Gateway</text>
    <text x="98" y="262" fill="#9ca3b5" font-size="11.5">Standard upstream connection</text>
    <rect x="98" y="276" width="154" height="21" rx="10.5" fill="#123b32"/>
    <text x="175" y="291" fill="#79e6ca" font-size="9.5" font-weight="750" text-anchor="middle" letter-spacing=".7">NO PLUGIN REQUIRED</text>

    <rect x="78" y="342" width="308" height="122" rx="16" fill="url(#relayCard)" stroke="#7567e8" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="98" y="362" width="40" height="40" rx="10" fill="#28204d" stroke="#8b7cff"/>
    <path d="M108 382h20M118 372v20M111 375l14 14M125 375l-14 14" stroke="#a99eff" stroke-width="2" stroke-linecap="round"/>
    <text x="152" y="375" fill="#f7f7fb" font-size="18" font-weight="700">Relay plugin</text>
    <text x="152" y="399" fill="#9ca3b5" font-size="12.5">Optional extensions + paired tools</text>
    <rect x="98" y="420" width="130" height="25" rx="12.5" fill="#28204d"/>
    <text x="163" y="437" fill="#b9b1ff" font-size="10.5" font-weight="750" text-anchor="middle" letter-spacing=".8">PAIR TO UNLOCK</text>
  </g>

  <g aria-label="Connection paths">
    <text x="452" y="176" fill="#79e6ca" font-size="11" font-weight="750" letter-spacing="1.8">STANDARD PATH</text>
    <text x="452" y="200" fill="#f7f7fb" font-size="17" font-weight="700">Chat · Sessions · Manage · Voice</text>
    <text x="452" y="222" fill="#858da3" font-size="12">Direct Dashboard/Gateway connection</text>
    <path d="M386 248C530 248 672 245 848 246" fill="none" stroke="#37d5b0" stroke-width="4" marker-start="url(#coreArrow)" marker-end="url(#coreArrow)"/>

    <text x="452" y="339" fill="#a99eff" font-size="11" font-weight="750" letter-spacing="1.8">OPTIONAL RELAY</text>
    <text x="452" y="363" fill="#f7f7fb" font-size="15" font-weight="700">Terminal · Media · Notifications · Enhanced voice</text>
    <text x="452" y="385" fill="#858da3" font-size="12">One pairing grant, scoped by feature</text>
    <path d="M386 403C552 403 650 425 740 425C790 425 815 354 850 330" fill="none" stroke="#8b7cff" stroke-width="3" stroke-dasharray="9 7" marker-start="url(#relayArrow)" marker-end="url(#relayArrow)"/>
    <path d="M386 420C560 420 684 455 850 462" fill="none" stroke="#8b7cff" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#relayArrow)"/>
  </g>

  <g aria-label="Your devices">
    <text x="854" y="141" fill="#858da3" font-size="11" font-weight="700" letter-spacing="2.2">YOUR DEVICES</text>
    <rect x="850" y="158" width="336" height="330" rx="22" fill="#0b0e17" stroke="#242a3d" stroke-width="1.5"/>

    <rect x="874" y="186" width="288" height="190" rx="18" fill="url(#deviceCard)" stroke="#4f5b7c" stroke-width="2"/>
    <rect x="898" y="207" width="38" height="58" rx="9" fill="#0a0c13" stroke="#8b7cff" stroke-width="1.5"/>
    <rect x="905" y="214" width="24" height="39" rx="4" fill="#171934"/>
    <circle cx="917" cy="258" r="2.5" fill="#7567e8"/>
    <text x="952" y="220" fill="#f7f7fb" font-size="18" font-weight="700">Hermes-Relay Android</text>
    <text x="952" y="245" fill="#9ca3b5" font-size="12.5">Google Play or sideload APK</text>
    <rect x="898" y="287" width="118" height="25" rx="12.5" fill="#123b32"/>
    <text x="957" y="304" fill="#79e6ca" font-size="10.5" font-weight="750" text-anchor="middle">STANDARD READY</text>
    <rect x="1026" y="287" width="112" height="25" rx="12.5" fill="#28204d"/>
    <text x="1082" y="304" fill="#b9b1ff" font-size="10.5" font-weight="750" text-anchor="middle">RELAY PAIRED</text>
    <rect x="898" y="327" width="240" height="28" rx="10" fill="#2f2111" stroke="#d78b29"/>
    <text x="1018" y="346" fill="#f2bd72" font-size="11" font-weight="700" text-anchor="middle">Sideload adds Device Control</text>

    <rect x="874" y="410" width="288" height="60" rx="14" fill="#151326" stroke="#7567e8" stroke-width="1.5"/>
    <rect x="898" y="426" width="34" height="27" rx="5" fill="#28204d"/>
    <path d="M906 434l5 5-5 5M915 444h8" fill="none" stroke="#b9b1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="948" y="436" fill="#f7f7fb" font-size="16" font-weight="700">Hermes-Relay CLI</text>
    <text x="948" y="455" fill="#9ca3b5" font-size="11.5">Hands on any paired computer</text>
  </g>

  <g aria-label="Architecture guarantees">
    <rect x="54" y="526" width="1132" height="58" rx="16" fill="#0b0e17" stroke="#242a3d"/>
    <circle cx="82" cy="555" r="5" fill="#37d5b0"/>
    <text x="98" y="560" fill="#d9dce5" font-size="13" font-weight="650">Chat never routes through Relay</text>
    <line x1="348" y1="542" x2="348" y2="568" stroke="#2b3042"/>
    <circle cx="382" cy="555" r="5" fill="#768097"/>
    <text x="398" y="560" fill="#d9dce5" font-size="13" font-weight="650">API server is compatibility fallback only</text>
    <line x1="724" y1="542" x2="724" y2="568" stroke="#2b3042"/>
    <circle cx="758" cy="555" r="5" fill="#f0a84f"/>
    <text x="774" y="560" fill="#d9dce5" font-size="13" font-weight="650">Device Control requires Relay + sideload</text>
  </g>
</svg>
